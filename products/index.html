<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products - tee135</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Products</h1></header>
  <nav><a href="../">Top</a></nav>
  <main><ul id="games"></ul></main>
  <footer><small>&copy; 2026 tee135</small></footer>
  <script>
    fetch('games.json')
      .then(r => r.json())
      .then(games => {
        const root = document.getElementById('games');
        for (const g of games) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = `games/${g.name}/`;
          a.textContent = g.title;
          li.appendChild(a);
          root.appendChild(li);
        }
      })
      .catch(() => { document.getElementById('games').textContent = 'ゲーム一覧を読み込めませんでした。'; });
  </script>
</body>
</html>
